apiVersion: apps/v1
kind: Deployment
metadata:
  name: parser
  namespace: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: parser
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: parser
    spec:
      containers:
        - name: parser
          image: command-parser:v1c
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: MODEL_URI
              value: "s3://models/models/v1/"
            - name: MODEL_VERSION
              value: "v1"
            - name: S3_ENDPOINT
              value: "http://seaweedfs.data.svc.cluster.local:8333"
            - name: MAX_NEW_TOKENS
              value: "64"
            - name: OMP_NUM_THREADS
              value: "1"
            - name: MKL_NUM_THREADS
              value: "1"
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef: {name: s3-creds, key: S3_ACCESS_KEY}
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: s3-creds, key: S3_SECRET_KEY}
          resources:
            requests: {cpu: "1", memory: "768Mi"}
            limits: {cpu: "2", memory: "1Gi"}
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: 8000}
            initialDelaySeconds: 5
            periodSeconds: 5
